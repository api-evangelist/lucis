aid: lucis
name: Lucis
description: >-
  Lucis is a Paris-based, AI-powered preventative health platform (Y Combinator
  P25; backed by General Catalyst) that helps members understand their biology
  through comprehensive lab testing and personalised coaching. Members receive
  two annual lab assessments (blood, urine, and saliva) at 450+ partner labs
  across Europe, producing 110+ data points across 11 body systems — metabolic,
  cardiovascular, hormonal, nervous, and more — which an AI engine turns into
  personalised action plans spanning nutrition, supplementation, sleep,
  activity, and mental health. The platform ingests wearable data (Garmin,
  Withings, Oura, Strava; Apple Watch and Whoop coming soon) for ongoing
  monitoring. Lucis is a consumer health product; as of this profile it exposes
  a member web/mobile application and a compliance portal but publishes no
  public developer API surface.
